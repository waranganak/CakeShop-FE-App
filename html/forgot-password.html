<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dream's Cake - Reset Password</title>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/forgot-password.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

<div class="bakery-glow-1"></div>
<div class="bakery-glow-2"></div>

<div class="login-card">
    <div class="brand-header">
        <div class="logo-icon">
            <i class="fa-solid fa-key"></i>
        </div>
        <h2>Reset Password</h2>
        <p>Enter your email to receive recovery instructions</p>
    </div>

    <div id="error-msg"></div>

    <div class="input-group">
        <div class="input-wrapper">
            <input type="email" id="resetEmail" placeholder="Enter your email address" autocomplete="off">
            <i class="fa-solid fa-envelope field-icon"></i>
        </div>
    </div>

    <button class="btn" id="resetBtn" onclick="handlePasswordReset()">
        <span class="btn-text">Send Reset Link</span>
        <div class="spinner" id="btnSpinner"></div>
    </button>

    <div class="card-footer">
        Remember your password? <a href="login.html">Sign In</a>
    </div>
</div>

<script src="/js/forgot-password.js"></script>

</body>
</html>
