<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dream's Cake - QR Scanner Terminal</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/Rider-Portal.css">
</head>

<body>

    <div class="bakery-glow-1"></div>
    <div class="bakery-glow-2"></div>

    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <i class="fa-solid fa-cake-candles"></i> Dream's Cake
            </div>
            <div class="nav-right-container">
                <div class="nav-menu">
                    <a href="/html/Rider-Portal.html"><i class="fas fa-arrow-left me-1"></i> Back to Dashboard</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">

                <div class="card rider-card border-0 p-4">
                    <div class="text-center mb-4">
                        <div class="hero-badge mx-auto mb-2">
                            <i class="fas fa-qrcode text-pink"></i> Secure QR Scanner
                        </div>
                        <h3 class="text-white fw-bold">Rider Verification Terminal</h3>
                        <p class="text-muted small">Align customer's order QR code within the frame below or enter ID manually.</p>
                    </div>

                    <div class="mb-4 text-center">
                        <div class="scanner-wrapper-modern">
                            <div class="scan-corner top-left"></div>
                            <div class="scan-corner top-right"></div>
                            <div class="scan-corner bottom-left"></div>
                            <div class="scan-corner bottom-right"></div>
                            
                            <div class="scan-laser-line"></div>

                            <div id="reader"></div>
                        </div>
                        <div class="scanner-hint mt-2">
                            <i class="fas fa-camera text-pink me-1"></i> Point camera to order QR code.
                        </div>
                    </div>

                    <div class="text-center text-muted my-2 divider-text"><span>or enter manual ID</span></div>

                    <div class="mb-4">
                        <div class="input-wrapper-custom shadow-sm mb-3">
                            <i class="fas fa-search search-icon"></i>
                            <input type="number" id="manualOrderId" class="form-control form-control-custom"
                                placeholder="Enter Order ID (e.g. 1085)">
                        </div>
                        <button class="btn btn-verify w-100 py-3 fw-bold shadow-sm" type="button"
                            onclick="searchByManualId()">
                            <i class="fas fa-check-circle me-1"></i> Verify Order Details
                        </button>
                    </div>

                    <div id="riderOrderResult" style="display: none;" class="mt-3">
                    </div>

                </div>

            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="/js/Rider-Portal.js"></script>
</body>

</html>
