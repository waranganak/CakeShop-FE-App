<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dream's Cake - Orders Management</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <link rel="stylesheet" href="/css/admin-dash.css">

  <script>
    let token = localStorage.getItem("JWT");
    let role = localStorage.getItem("role");

    if (!token || role !== "ADMIN") {
      alert("Access Denied! Admins only.");
      window.location.href = "login.html";
    }
  </script>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-brand">
    <i class="fa-solid fa-cake-candles"></i> Dream's Cake
  </div>
  <ul class="sidebar-menu">
    <li><a href="/html/admin-dash.html"><i class="fa-solid fa-house"></i> Dashboard</a></li>
    <li><a href="/html/categories.html"><i class="fa-solid fa-list-check"></i> Categories</a></li>
    <li><a href="/html/product.html"><i class="fa-solid fa-birthday-cake"></i> Cakes / Products</a></li>
    <li><a href="/html/order.html" class="active"><i class="fa-solid fa-shopping-cart"></i> Orders</a></li>
    <li><a href="/html/customers.html"><i class="fa-solid fa-users"></i> Customer</a></li>
    <li><a href="/html/inventory.html"><i class="fa-solid fa-boxes-stacked"></i> Inventory Stock</a></li>
    <li><a href="#" id="logoutBtn" style="margin-top: auto; color: #f87171;"><i class="fa-solid fa-right-from-bracket"></i> Logout</a></li>
  </ul>
</div>

<div class="main-content">
  <div class="header-top">
    <h1>Orders Management 🛒</h1>
    <p style="color: #94a3b8;">Manage customer cake orders and track delivery statuses.</p>
  </div>

  <div class="logs-container" style="background: white; padding: 20px; border-radius: 10px; margin-top: 20px;">
    <h4 class="mb-3"><i class="fa-solid fa-list" style="color: #ff758c;"></i> Customer Orders List</h4>
    <table class="table table-striped">
      <thead>
      <tr>
        <th>Order ID</th>
        <th>Customer</th>
        <th>Date / Time</th>
        <th>Total Amount</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
      </thead>
      <tbody id="orders-table-body">
      </tbody>
    </table>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/order.js"></script>

</body>
</html>
